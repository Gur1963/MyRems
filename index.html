    confirmDeleteUser: email => `Remove ${email} from the approved users list?`,

    offsets: { 168:'1 week before', 72:'3 days before', 24:'1 day before', 12:'12 hours before', 2:'2 hours before', 1:'1 hour before', 0.5:'30 minutes before', 0.1667:'10 minutes before', 0:'At the exact time' },
    repeats: { none:'One-time', daily:'Every day', weekly:'Every week', monthly:'Every month', yearly:'Every year' },

function t(key) { return I18N[data.language || 'he'][key]; }

// ── אפשרויות זמני התראה וחזרתיות (זהה ל-MyLists, לעקביות) ──────────────────
const OFFSET_HOURS = [168, 72, 24, 12, 2, 1, 0.5, 0.1667, 0];
function offsetLabel(hours) {
  const key = OFFSET_HOURS.find(h => Math.abs(h - hours) < 0.01);
  return (key !== undefined) ? I18N[data.language || 'he'].offsets[key] : `${hours}h`;
}

const REPEAT_VALUES = ['none', 'daily', 'weekly', 'monthly', 'yearly'];
function repeatLabel(value) {
  return I18N[data.language || 'he'].repeats[value] || '';
}

// ── בונה מחדש את תיבות הסימון של זמני ההתראה ואת אפשרויות החזרתיות בשפה
// הנוכחית, תוך שמירה על מה שכבר נבחר (נקרא גם בטעינה ראשונית וגם בהחלפת שפה).
function buildOffsetCheckboxes() {
  const container = document.getElementById('offsets-row');
  const prevSelected = getSelectedOffsets();
  container.querySelectorAll('label').forEach(el => el.remove());
  OFFSET_HOURS.forEach(h => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'offset-cb';
    cb.value = h;
    cb.addEventListener('change', () => onOffsetChange(cb));
    label.appendChild(cb);
    label.appendChild(document.createTextNode(offsetLabel(h)));
    container.appendChild(label);
  });
  resetOffsetCheckboxes(prevSelected.length ? prevSelected : [24]);
}
function buildRepeatOptions() {
  const select = document.getElementById('new-repeat');
  const prevValue = select.value || 'none';
  select.innerHTML = '';
  REPEAT_VALUES.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = repeatLabel(v);
    select.appendChild(opt);
  });
  select.value = prevValue;
}

// ── מיישם את השפה הנוכחית על כל הממשק (טקסטים, כיוון, פריטים) - נקרא בטעינה
// ובכל החלפת שפה.

  const cfg = I18N[data.language || 'he'];
  document.documentElement.lang = (data.language || 'he');
  document.documentElement.dir = cfg.dir;
  document.body.style.direction = cfg.dir;
  document.title = (data.language === 'en') ? 'MyRems - Reminders' : 'MyRems - תזכורות';

  document.getElementById('admin-btn').textContent = t('adminBtn');
  document.getElementById('lang-btn').textContent = t('langBtn');
  document.getElementById('logout-btn').textContent = t('logoutBtn');
  document.getElementById('push-banner-btn').textContent = t('pushEnableBtn');
  document.getElementById('new-text').placeholder = t('newTextPh');
  document.getElementById('new-text').style.direction = cfg.dir;
  document.getElementById('new-location').placeholder = t('newLocationPh');
  document.getElementById('new-location').style.direction = cfg.dir;
  document.getElementById('offsets-label').textContent = t('offsetsLabel');
  document.getElementById('repeat-label').textContent = t('repeatLabel');
  document.getElementById('tab-btn-active').textContent = t('tabActive');
  document.getElementById('tab-archive-text').textContent = t('tabArchive');
  document.getElementById('admin-title').textContent = t('adminTitle');
  document.getElementById('admin-back-btn').textContent = t('backBtn');
  document.getElementById('new-user-email').placeholder = t('newUserEmailPh');

  buildOffsetCheckboxes();
  buildRepeatOptions();
  renderItems();
  refreshPushBanner();
  if (document.getElementById('admin-screen').style.display !== 'none') renderAdminUsers();
}

function toggleLanguage() {
  data.language = (data.language === 'en') ? 'he' : 'en';
  save();
  applyI18n();
}
applyI18n();

// ── שמירה/טעינה ──────────────────────────────────────────────────────────
async function save() {
  if (!DOC) return;
  try { await setDoc(DOC, data); }
  catch (e) { alert(t('errSave') + e.message); }
}

async function loadFromCloud() {
  try {
    const snap = await getDoc(DOC);
    if (snap.exists()) {
      data = snap.data();
      if (!Array.isArray(data.items)) data.items = [];
    } else {
      data = { items: [], pushSubscription: null };
      await setDoc(DOC, data);
    }
  } catch (e) {
    console.error('שגיאת טעינה:', e);
  }
  applyI18n();
}

function hideAllScreens() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('noaccess-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'none';
}
// מסכי הכניסה וה"אין הרשאה" תמיד בעברית (עוד לפני שידוע לנו באיזו שפה המשתמש
// בחר לעבוד בתוך האפליקציה) - מאפסים דחיפה של כיוון RTL/LTR שנשארה מסשן קודם.
function forceHebrewDir() {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';
  document.body.style.direction = 'rtl';
}
function showLoginScreen() {
  hideAllScreens();
  forceHebrewDir();
  document.getElementById('login-screen').style.display = 'flex';
}
function showAppScreen() {
  hideAllScreens();
  document.getElementById('app-screen').style.display = 'flex';
}
function showNoAccessScreen() {
  hideAllScreens();
  forceHebrewDir();
  document.getElementById('noaccess-screen').style.display = 'flex';
}

async function checkUserAllowed(email) {
  try {
    const snap = await getDoc(doc(db, 'rems_allowed_users', email));
    return snap.exists() && snap.data().status === 'active';
  } catch (e) {
    console.error('שגיאה בבדיקת הרשאה:', e);
    return false;
  }
}

let _loginInProgress = false;
async function loginWithGoogle() {
  if (_loginInProgress) return;
  _loginInProgress = true;
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code !== 'auth/cancelled-popup-request' && e.code !== 'auth/popup-closed-by-user') {
      alert(t('errLogin') + e.message);
    }
  } finally {
    _loginInProgress = false;
  }
}

async function logout() { await signOut(auth); }

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    isAdmin = (user.email === ADMIN_EMAIL);
    document.getElementById('admin-btn').style.display = isAdmin ? '' : 'none';

    if (!isAdmin) {
      const allowed = await checkUserAllowed(user.email);
      if (!allowed) {
        showNoAccessScreen();
        return;
      }
    }

    DOC = doc(db, 'rems_users', user.uid);
    document.getElementById('user-name').textContent = user.displayName || user.email;
    await loadFromCloud();
    showAppScreen();
    highlightFromUrl();
  } else {
    currentUser = null;
    isAdmin = false;
    DOC = null;
    showLoginScreen();
  }
});

// ── Push: הפעלת התראות בדפדפן (Web Push) ────────────────────────────────
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function refreshPushBanner() {
  const banner = document.getElementById('push-banner');
  const text = document.getElementById('push-banner-text');
  const btn = document.getElementById('push-banner-btn');
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    banner.style.display = 'flex';
    banner.className = '';
    text.textContent = t('pushUnsupported');
    btn.style.display = 'none';
    return;
  }
  if (Notification.permission === 'granted' && data.pushSubscription) {
    banner.style.display = 'flex';
    banner.className = 'ok';
    text.textContent = t('pushOn');
    btn.style.display = 'none';
  } else {
    banner.style.display = 'flex';
    banner.className = '';
    text.textContent = t('pushOff');
    btn.style.display = '';
  }
}

async function enablePush() {
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert(t('errPushDenied'));
      return;
    }
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    data.pushSubscription = subscription.toJSON();
    await save();
    refreshPushBanner();
  } catch (e) {
    alert(t('errPushEnable') + e.message);
  }
}

// ── ניהול משתמשים (רק למנהל - ADMIN_EMAIL) ──────────────────────────────
// רשימת המשתמשים המורשים נשמרת ב-collection נפרד 'rems_allowed_users',
// כאשר ה-id של כל מסמך הוא כתובת המייל עצמה. סטטוס 'active' = מורשה,
// 'suspended' = הרשאה מושהית זמנית (בלי למחוק אותו מהרשימה).
async function openAdminScreen() {
  hideAllScreens();
  document.getElementById('admin-screen').style.display = 'flex';
  await renderAdminUsers();
}
function closeAdminScreen() {
  showAppScreen();
}

async function renderAdminUsers() {
  const container = document.getElementById('admin-users-list');
  container.innerHTML = `<div class="empty-state">${t('adminLoading')}</div>`;
  try {
    const snap = await getDocs(collection(db, 'rems_allowed_users'));
    if (snap.empty) {
      container.innerHTML = `<div class="empty-state">${t('adminEmpty')}</div>`;
      return;
    }
    container.innerHTML = '';
    snap.forEach(d => {
      const u = d.data();
      const status = u.status === 'suspended' ? 'suspended' : 'active';
      const statusText = status === 'active' ? t('statusActive') : t('statusSuspended');
      const toggleText = status === 'active' ? t('suspendBtn') : t('enableBtn');
      const row = document.createElement('div');
      row.className = 'user-row';
      row.innerHTML = `
        <span class="user-email">${u.email || d.id}</span>
        <span class="user-status-badge ${status}">${statusText}</span>
        <button class="suspend-btn" onclick="toggleUserStatus('${d.id}','${status}')">${toggleText}</button>
        <button class="delete-btn" onclick="deleteAllowedUser('${d.id}')">${t('deleteBtn')}</button>
      `;
      container.appendChild(row);
    });
  } catch (e) {
    container.innerHTML = `<div class="empty-state">${t('errLoadUsers')}${e.message}</div>`;
  }
}

async function addAllowedUser() {
  const input = document.getElementById('new-user-email');
  const email = input.value.trim().toLowerCase();
  if (!email || !email.includes('@')) {
    alert(t('errInvalidEmail'));
    return;
  }
  try {
    await setDoc(doc(db, 'rems_allowed_users', email), {
      email,
      status: 'active',
      addedAt: new Date().toISOString(),
    });
    input.value = '';
    await renderAdminUsers();
  } catch (e) {
    alert(t('errAddUser') + e.message);
  }
}

async function toggleUserStatus(email, currentStatus) {
  const newStatus = currentStatus === 'active' ? 'suspended' : 'active';
  try {
    await setDoc(doc(db, 'rems_allowed_users', email), { status: newStatus }, { merge: true });
    await renderAdminUsers();
  } catch (e) {
    alert(t('errUpdateStatus') + e.message);
  }
}

async function deleteAllowedUser(email) {
  if (!confirm(t('confirmDeleteUser')(email))) return;
  try {
    await deleteDoc(doc(db, 'rems_allowed_users', email));
    await renderAdminUsers();
  } catch (e) {
    alert(t('errDeleteUser') + e.message);
  }
}

// ── Reminders CRUD ───────────────────────────────────────────────────────
function onOffsetChange(cb) {
  const checked = document.querySelectorAll('.offset-cb:checked');
  if (checked.length > 3) {
    cb.checked = false;
    alert(t('maxOffsets'));
  }
}
function getSelectedOffsets() {
  return Array.from(document.querySelectorAll('.offset-cb:checked')).map(cb => parseFloat(cb.value));
}
function resetOffsetCheckboxes(selected) {
  const sel = (selected && selected.length) ? selected : [24];
  document.querySelectorAll('.offset-cb').forEach(cb => {
    cb.checked = sel.some(h => Math.abs(h - parseFloat(cb.value)) < 0.01);
  });
}

// אחרי לחיצה על התראת Push, מגיעים לכאן עם ?highlight=date|time - מגלגלים
// אל הפריט המתאים ומהבהבים אותו כדי שיהיה ברור מיד איזו תזכורת זו, בלי לגלול ולחפש.
// אם הפריט כבר סומן כבוצע ועבר לארכיון, עוברים אוטומטית לטאב הארכיון ומוצאים אותו שם.
function highlightFromUrl() {
  const params = new URLSearchParams(location.search);
  const key = params.get('highlight');
  if (!key) return;

  let row = document.querySelector(`#items-list .item-row[data-key="${CSS.escape(key)}"]`);
  if (!row) {
    // querySelector מוצא אלמנטים גם כשההורה שלהם display:none, אז אפשר לבדוק
    // בטאב הארכיון גם בלי לעבור אליו קודם
    const archiveRow = document.querySelector(`#archive-list .item-row[data-key="${CSS.escape(key)}"]`);
    if (archiveRow) {
      switchTab('archive');
      row = document.querySelector(`#archive-list .item-row[data-key="${CSS.escape(key)}"]`);
    }
  }
  if (row) {
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.add('highlight-flash');
    setTimeout(() => row.classList.remove('highlight-flash'), 3000);
  }

  params.delete('highlight');
  const newUrl = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash;
  history.replaceState(null, '', newUrl);
}

// פריטים פעילים (לא בוצעו) מוצגים בטאב "תזכורות", ממוינים לפי התאריך/שעה הקרוב ביותר.
// פריטים שבוצעו (done) עוברים אוטומטית לטאב "ארכיון" הנפרד, ולא נמחקים ידנית יותר -
// הם יימחקו לצמיתות אוטומטית אחרי תקופת השמירה (ר' send-reminders.js).
let activeTab = 'active'; // 'active' | 'archive'

function switchTab(tab) {
  activeTab = tab;
  renderItems();
}

function renderItems() {
  const container = document.getElementById('items-list');
  const archiveContainer = document.getElementById('archive-list');
  const archiveCountEl = document.getElementById('archive-count');
  const tabBtnActive = document.getElementById('tab-btn-active');
  const tabBtnArchive = document.getElementById('tab-btn-archive');
  container.innerHTML = '';
  archiveContainer.innerHTML = '';

  const activeItems = data.items.filter(item => !item.done);
  const archivedItems = data.items.filter(item => item.done);

  activeItems.sort((a, b) => {
    const ka = `${a.date || ''} ${a.time || ''}`;
    const kb = `${b.date || ''} ${b.time || ''}`;
    return ka.localeCompare(kb);
  });
  // בארכיון - מי שהושלם/בוצע לאחרונה מוצג ראשון
  archivedItems.sort((a, b) => (b.archivedAt || '').localeCompare(a.archivedAt || ''));

  archiveCountEl.textContent = archivedItems.length;

  if (!activeItems.length) {
    container.innerHTML = `<div class="empty-state">${t('emptyActive')}</div>`;
  } else {
    activeItems.forEach(item => renderRow(container, data.items.indexOf(item), item));
  }

  if (!archivedItems.length) {
    archiveContainer.innerHTML = `<div class="empty-state">${t('emptyArchive')}</div>`;
  } else {
    archivedItems.forEach(item => renderRow(archiveContainer, data.items.indexOf(item), item));
  }

  container.style.display = activeTab === 'active' ? '' : 'none';
  archiveContainer.style.display = activeTab === 'archive' ? '' : 'none';
  tabBtnActive.classList.toggle('active', activeTab === 'active');
  tabBtnArchive.classList.toggle('active', activeTab === 'archive');
}

function renderRow(container, i, item) {
  const dateLabel = item.date ? new Date(item.date + 'T00:00:00').toLocaleDateString(t('dateLocale'), {day:'numeric',month:'short',year:'numeric'}) : '';
  const timeLabel = item.time || '';
  const offsets = (item.reminderOffsets && item.reminderOffsets.length) ? item.reminderOffsets : [24];
  const offsetsText = offsets.map(offsetLabel).join(' · ');
  const repeatText = (item.repeat && item.repeat !== 'none') ? repeatLabel(item.repeat) : '';
  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.key = `${item.date}|${item.time}`;
  row.innerHTML = `
    <div class="row-top">
      <div class="item-check ${item.done?'checked':''}" onclick="toggleItem(${i})"></div>
      <div style="flex:1;min-width:0">
        <div class="item-text ${item.done?'done':''}">${item.text}</div>
        ${item.location ? `<div style="font-size:12px;color:#888;margin-top:2px">📍 ${item.location}</div>` : ''}
        <div style="font-size:12px;color:#c0392b;margin-top:4px">🔔 ${dateLabel}${timeLabel ? ' · ' + timeLabel : ''}</div>
        <div style="font-size:10px;color:#aaa;margin-top:2px">⏰ ${offsetsText}</div>
        ${repeatText ? `<div style="font-size:10px;color:#8e44ad;margin-top:2px">🔁 ${repeatText}</div>` : ''}
      </div>
      ${!item.done ? `<button class="card-action-btn" onclick="editItem(${i})">✎</button>` : ''}
      <button class="item-del" onclick="deleteItem(${i})">✕</button>
    </div>`;
  container.appendChild(row);
}

function toggleItem(i) {
  const item = data.items[i];
  item.done = !item.done;
  // archivedAt מסמן מתי הפריט עבר לארכיון - זה מה שקובע מתי הוא יימחק לצמיתות
  // (ר' ARCHIVE_RETENTION_MS ב-send-reminders.js). אם מחזירים לפעיל - מנקים את זה.
  item.archivedAt = item.done ? new Date().toISOString() : null;
  save(); renderItems();
}

function deleteItem(i) {
  data.items.splice(i, 1);
  save(); renderItems();
}

function editItem(i) {
  const item = data.items[i];
  const text = prompt(t('promptText'), item.text);
  if (text === null || !text.trim()) return;
  const location = prompt(t('promptLocation'), item.location || '');
  const date = prompt(t('promptDate'), item.date || '');
  const time = prompt(t('promptTime'), item.time || '');

  const offsetLegend = OFFSET_HOURS.map((h, idx) => `${idx + 1}. ${offsetLabel(h)}`).join('\n');
  const currentOffsets = (item.reminderOffsets && item.reminderOffsets.length) ? item.reminderOffsets : [24];
  const currentNums = currentOffsets
    .map(h => OFFSET_HOURS.findIndex(oh => Math.abs(oh - h) < 0.01) + 1)
    .filter(n => n > 0).join(',');
  const offsetsInput = prompt(`${t('promptOffsets')}\n${offsetLegend}`, currentNums || '3');
  let reminderOffsets = currentOffsets;
  if (offsetsInput !== null) {
    const nums = offsetsInput.split(',').map(s => parseInt(s.trim(), 10)).filter(n => n >= 1 && n <= OFFSET_HOURS.length);
    const uniqueNums = [...new Set(nums)].slice(0, 3);
    if (uniqueNums.length) reminderOffsets = uniqueNums.map(n => OFFSET_HOURS[n - 1]);
  }

  const repeatLegend = REPEAT_VALUES.map((v, idx) => `${idx + 1}. ${repeatLabel(v)}`).join('\n');
  const currentRepeat = item.repeat || 'none';
  const currentRepeatNum = REPEAT_VALUES.indexOf(currentRepeat) + 1;
  const repeatInput = prompt(`${t('promptRepeat')}\n${repeatLegend}`, String(currentRepeatNum || 1));
  let repeat = currentRepeat;
  if (repeatInput !== null) {
    const n = parseInt(repeatInput.trim(), 10);
    if (n >= 1 && n <= REPEAT_VALUES.length) repeat = REPEAT_VALUES[n - 1];
  }

  item.text = text.trim();
  item.location = (location || '').trim();
  item.date = date || item.date;
  item.time = time || item.time;
  item.reminderOffsets = reminderOffsets;
  item.repeat = repeat;
  item.notifiedOffsets = [];
  item.done = false;
  item.archivedAt = null;
  save(); renderItems();
}

function addReminder() {
  const text = document.getElementById('new-text').value.trim();
  const location = document.getElementById('new-location').value.trim();
  const date = document.getElementById('new-date').value;
  const time = document.getElementById('new-time').value;
  if (!text || !date || !time) return;
  let reminderOffsets = getSelectedOffsets();
  if (!reminderOffsets.length) reminderOffsets = [24];
  const repeat = document.getElementById('new-repeat').value || 'none';
  data.items.push({ text, location, date, time, done: false, reminderOffsets, notifiedOffsets: [], repeat });
  save(); renderItems();
  document.getElementById('new-text').value = '';
  document.getElementById('new-location').value = '';
  document.getElementById('new-date').value = '';
  document.getElementById('new-time').value = '';
  resetOffsetCheckboxes([24]);
  document.getElementById('new-repeat').value = 'none';
  document.getElementById('new-text').focus();
}

// חשיפה ל-window - חובה כי זה <script type="module">, ואירועי onclick/onchange
// בתוך ה-HTML רצים בהיקף הגלובלי ולא יכולים לראות פונקציות ברמת המודול.
Object.assign(window, {
  loginWithGoogle, logout, enablePush, toggleLanguage,
  onOffsetChange, toggleItem, deleteItem, editItem, addReminder, switchTab,
  openAdminScreen, closeAdminScreen, addAllowedUser, toggleUserStatus, deleteAllowedUser,
});
</script>
